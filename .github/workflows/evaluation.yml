name: Evaluation utility checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-evaluation.txt
      - run: python -m pip install -r requirements-evaluation.txt
      - run: python -m unittest discover -s tests -p test_evaluation.py -v
      - run: python scripts/evaluation_readout.py
      - run: python -m py_compile app.py readmission_audit/pipeline.py scripts/build_readmission_audit.py
