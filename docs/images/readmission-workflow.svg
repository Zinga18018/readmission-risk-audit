<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" role="img" aria-labelledby="title desc">
<title id="title">Readmission Risk Audit workflow</title>
<desc id="desc">Public hospital encounters are cleaned and split with patients disjoint under an encounter-order proxy. Training fits preprocessing and models; validation selects blend, calibration, and threshold; the historically reused test cohort supplies evaluation. Saved outputs feed the dashboard. Aggregate-only results do not support patient-cluster confidence intervals.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e33"/><stop offset="1" stop-color="#152d43"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#7f9bb7" stroke-width="1.6"/></marker>
 <style>text{font-family:Segoe UI,Arial,sans-serif} .title{fill:#f3f7fc;font-size:32px;font-weight:700}.sub{fill:#c0d0e0;font-size:18px}.h{fill:#eff6ff;font-size:23px;font-weight:650}.b{fill:#c9d7e5;font-size:18px}.tag{font-size:15px;letter-spacing:1.3px;font-weight:700}.line{fill:none;stroke:#7f9bb7;stroke-width:2;marker-end:url(#arrow)}.card{fill:#1d344c;stroke:#48627b;stroke-width:1.3}</style>
</defs>
<rect width="1100" height="920" rx="24" fill="url(#bg)"/>
<text x="42" y="57" class="title">Readmission Risk Audit</text>
<text x="42" y="90" class="sub">Follow the cohort, the selection rules, and the limits of the evidence.</text>
<rect x="42" y="129" width="300" height="117" rx="15" class="card"/>
<text x="62" y="162" class="tag" fill="#8bd5e7">01 / PUBLIC DATA</text>
<text x="62" y="196" class="h">UCI hospital encounters</text>
<text x="62" y="225" class="b">Target: readmission within 30 days</text>
<path d="M344 188H391" class="line"/>
<rect x="400" y="129" width="300" height="117" rx="15" class="card"/>
<text x="420" y="162" class="tag" fill="#8bd5e7">02 / ELIGIBILITY</text>
<text x="420" y="196" class="h">Clean eligible encounters</text>
<text x="420" y="225" class="b">Remove ineligible dispositions</text>
<path d="M702 188H749" class="line"/>
<rect x="758" y="129" width="300" height="117" rx="15" class="card"/>
<text x="778" y="162" class="tag" fill="#8bd5e7">03 / COHORTS</text>
<text x="778" y="196" class="h">Keep patients disjoint</text>
<text x="778" y="225" class="b">Drop boundary-crossing patients</text>
<path d="M908 248V285H202V326" class="line"/>
<text x="405" y="276" class="sub">Encounter ID gives order, not calendar time</text>
<rect x="42" y="337" width="300" height="221" rx="15" fill="#143f48" stroke="#417b83" stroke-width="1.3"/>
<text x="62" y="374" class="tag" fill="#8ae2cf">TRAIN / FIT</text>
<text x="62" y="411" class="h">Fit on training data</text>
<text x="62" y="446" class="b">Train-fitted preprocessing</text>
<text x="62" y="476" class="b">Linear, tree, neural candidates</text>
<text x="62" y="523" class="sub">Feature rules shared by cohorts</text>
<path d="M344 443H391" class="line"/>
<rect x="400" y="337" width="300" height="221" rx="15" fill="#283b62" stroke="#647caa" stroke-width="1.3"/>
<text x="420" y="374" class="tag" fill="#b8c9ff">VALIDATION / SELECT</text>
<text x="420" y="411" class="h">Freeze the decision rules</text>
<text x="420" y="446" class="b">Select CatBoost blend weight</text>
<text x="420" y="476" class="b">Temperature-scale probabilities</text>
<text x="420" y="506" class="b">Choose the F1 threshold</text>
<path d="M702 443H749" class="line"/>
<rect x="758" y="337" width="300" height="221" rx="15" fill="#423925" stroke="#9b8657" stroke-width="1.3"/>
<text x="778" y="374" class="tag" fill="#f3d78c">HISTORICAL TEST / AUDIT</text>
<text x="778" y="411" class="h">Measure tradeoffs</text>
<text x="778" y="446" class="b">Ranking and calibration</text>
<text x="778" y="476" class="b">Data shift and threshold workload</text>
<text x="778" y="523" class="sub">Repeated inspection disclosed</text>
<path d="M908 560V594" class="line"/>
<rect x="42" y="605" width="1016" height="105" rx="15" class="card"/>
<text x="62" y="639" class="tag" fill="#8bd5e7">SAVED OUTPUTS → STREAMLIT</text>
<text x="62" y="675" class="h">Compare models · inspect drift · try the saved ensemble on one encounter</text>
<rect x="42" y="738" width="1016" height="70" rx="12" fill="#423925" stroke="#9b8657"/>
<text x="62" y="767" fill="#f4d997" font-size="18" font-weight="700">Historical and exploratory. Patient separation does not make a reused test cohort untouched.</text>
<text x="62" y="793" fill="#e6d3ad" font-size="17">Educational audit only. These results do not establish present-day clinical validity.</text>
<text x="42" y="852" class="b">Uncertainty boundary: aggregates cannot reconstruct patient-cluster intervals.</text>
<text x="42" y="881" class="sub">The bootstrap utility needs real encounter probabilities linked to patient IDs; that path is not executed here.</text>
</svg>
